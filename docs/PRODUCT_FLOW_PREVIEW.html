<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#243146;background:#f5f7fa;font-size:14px;line-height:1.6;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce2ea;background:white;border-radius:7px;padding:7px 13px;color:inherit}button:hover{background:#eef3fb}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b6f8;outline-offset:2px}.primary{background:#2866d7;color:white;border-color:#2866d7}.primary:hover{background:#1d55ba}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{padding:24px 14px;border-right:1px solid #dce2ea;background:#fff}.brand{font-size:21px;font-weight:650;padding:0 12px 16px}.brand small{display:block;font-size:11px;font-weight:400;color:#718096}.nav-group{padding:17px 12px 6px;color:#8390a2;font-size:11px}nav button{display:block;width:100%;text-align:left;border:0;margin:3px 0;background:transparent;padding:9px 12px}nav button.active{color:#215bbc;background:#edf3ff;font-weight:600}.note{color:#718096;font-size:12px}.aside-note{margin:28px 12px 0;font-size:11px;color:#718096}main{min-width:0;padding:0 32px 40px;max-width:1280px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce2ea;padding:17px 0;gap:20px}header span{font-size:12px;color:#718096}header a{font-size:12px;color:#2866d7}h1{font-size:26px;font-weight:650;line-height:1.3;margin:28px 0 8px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0 16px}.intro{max-width:820px;color:#64748b}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0}.panel{background:#fff;border:1px solid #dce2ea;border-radius:10px;padding:20px;margin:16px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.columns .panel{margin:0}.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #e9e om:22px;right:22px;background:#26374f;color:white;padding:12px 18px;border-radius:8px;max-width:420px;z-index:10}kbd{font-size:11px;border:1px solid #dce2ea;border-bottom-width:2px;border-radius:4px;padding:2px 6px;background:white}ul{padding-left:20px}.content-list li{margin:9px 0}@media(max-width:900px){.shell{grid-template-columns:175px 1fr}main{padding:0 20px 30px}.columns,.screen-grid{grid-template-columns:1fr}.row{flex-wrap:wrap}}@media(max-width:560px){.shell{display:block}aside{padding:14px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.nav-group,.aside-note{display:none}.brand{padding-bottom:3px}main{padding:0 16px 25px}header{flex-wrap:wrap}.row button{font-size:12px}}

<body>
<div class="shell"><aside><div class="brand">Nestra<small>功能设计 · 交互草图</small></div><nav id="nav" aria-label="控制中心模块"></nav><p class="aside-note">所有内容均为演示数据。这里的操作只改变草图状态，不调用系统、不移动文件。</p></aside>
<main><header><span>控制中心 / <b id="breadcrumb">桌面总览</b></span><a href="PRODUCT_REDESIGN_20261002.md">查看完整功能设计稿</a><button data-go="search">搜索 <kbd>Ctrl Alt F</kbd></button></header><section id="content" aria-live="polite"></section><footer>2026-10-02 · 产品结构草图，非最终视觉稿，非已实现功能演示。最终控件采用已选定的 Nuxt UI。</footer></main></div>
<dialog id="create"><div id="dialog-body"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const modules=[['desktop','桌面总览','桌面与文件'],['files','文件与收纳',''],['launcher','快捷启动','效率工具'],['search','搜索与导航',''],['widgets','小组件',''],['layout','布局与显示器','偏好与数据'],['appearance','外观',''],['data','数据与备份',''],['system','系统设置','']];
const sources=[{name:'待处理',type:'收纳区',path:'桌面\\.nestra\\待处理',visible:true,policy:'拖入会移动文件'},{name:'项目资料',type:'文件夹映射',path:'D:\\项目资料',visible:true,policy:'浏览模式 · 不接收拖入'},{name:'桌面文档',type:'分类视图',path:'个人桌面 · 文档',visible:false,policy:'仅筛选 · 文件位置不变'}];
const examples=[{name:'项目报告.docx',path:'桌面\\.nestra\\待处理\\项目报告.docx',source:'收纳区'},{name:'项目资料',path:'D:\\项目资料',source:'文件夹映射'},{name:'季度报告.pdf',path:'D:\\归档\\季度报告.pdf',source:'Everything'},{name:'计算器',path:'Windows 应用入口',source:'应用目录'}];
const flowData={organize:['选择“新建收纳区”，输入名称并确认实际目录。','创建的是空面板；原桌面文件保持原位。','拖入文件前显示“移动到”及目标；成功后才改变界面。','打开或放回桌面；解散时逐项返回文件，失败项留在原区。'],project:['添加已有文件夹映射，默认只浏览。','新建文件组，将映射和待处理收纳区加入来源列表。','在“全部来源”查找项目，再按实际路径打开。','固定到快捷启动只增加引用；移除文件组不改来源。'],restore:['导入配置，检查版本和当前数据。','列出缺失路径、显示器变化与将改变的小组件内容。','重新绑定目录；不得据旧名称自动改动真实目录。','保存恢复前配置，再应用；用户原文件不在配置备份中。']};
let page='desktop',everything=false,flow='organize',widgetHidden=false;
const nav=document.querySelector('#nav'),content=document.querySelector('#content'),dialog=document.querySelector('#create');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){const t=document.querySelector('#toast');t.textContent=message;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,4300)}
function title(name,intro){return `<h1>${name}</h1><p class="intro">${intro}</p>`}
function bulletPanel(name,items){return `<div class="panel"><h2>${name}</h2><ul class="content-list">${items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function flowView(){return `<div class="panel"><h2>核心流程</h2><div class="toolbar flow-tabs">${[['organize','真收纳'],['project','项目工作区'],['restore','备份恢复']].map(([id,label])=>`<button data-flow="${id}" class="${flow===id?'selected':''}">${label}</button>`).join('')}</div><ol class="steps">${flowData[flow].map(s=>`<li>${s}</li>`).join('')}</ol></div>`}
function render(){nav.innerHTML=modules.map(([id,label,group])=>`${group?`<div class="nav-group">${group}</div>`:''}<button data-go="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('');document.querySelector('#breadcrumb').textContent=modules.find(x=>x[0]===page)[1];
const screens={
desktop:()=>title('桌面总览','桌面负责访问与操作；控制中心负责创建、配置与诊断。先形成可用的任务流程，再统一外观。')+`<div class="toolbar"><button class="primary" data-add>添加桌面内容</button><button data-go="layout">定位与排列面板</button></div><div class="columns"><div class="panel"><h2>桌面运行状态</h2><div class="row"><span class="grow">Nestra 桌面</span><span class="badge">正在显示 · 演示</span></div><div class="row"><span class="grow">原生图标</span><span>共存模式</span></div><div class="row"><span class="grow">隐藏对象</span><button data-go="files">查看并恢复</button></div></div><div class="panel"><h2>需要关注</h2><div class="row"><span class="grow">Everything 搜索</span><button data-go="search">${everything?'演示连接正常':'未连接 · 查看范围'}</button></div><div class="row"><span class="grow">外盘中的固定入口</span><button data-go="launcher">查看失效入口</button></div><p class="note">正式版读取实际状态，不使用这里的演示数据。</p></div></div>`+flowView(),
files:()=>title('文件与收纳','来源、视图和文件组分别管理。只有明确的文件操作才会改变文件存放位置。')+`<div class="toolbar"><button class="primary" data-add>添加桌面内容</button><button data-explain="整理规则">整理规则 · 先看移动预览</button></div><div class="panel"><h2>文件来源与视图</h2>${sources.map((s,i)=>`<div class="row"><span class="badge ${s.type==='收纳区'?'':'muted'}">${s.type}</span><div class="grow"><strong>${esc(s.name)}</strong><div class="path">${esc(s.path)}</div><div class="note">${s.policy}</div></div><button data-toggle-source="${i}">${s.visible?'隐藏面板':'显示并定位'}</button><button data-source-detail="${i}">管理</button></div>`).join('')}</div><div class="panel"><h2>文件组 · 工作</h2><p>来源：待处理 / 项目资料。面板有独立位置，来源排序不会移动面板。</p><div class="toolbar"><button data-go="search">搜索全部来源</button><button data-explain="解散文件组">解散文件组</button></div><p class="note">“全部来源”不是唯一移动目标；拖入需要选择具体可写来源。</p></div>`,
launcher:()=>title('快捷启动','固定项目与快捷集合统一管理。所有入口都只引用原项目。')+`<div class="toolbar"><button class="primary" data-go="search">从搜索结果固定</button><button data-explain="快捷集合">创建快捷集合</button></div><div class="panel"><h2>固定入口</h2><div class="row"><div class="grow"><strong>项目资料</strong><div class="path">D:\\项目资料</div></div><span class="badge">可用 · 演示</span><button data-explain="移除引用">移除引用</button></div><div class="row"><div class="grow"><strong>外盘文档</strong><div class="path">E:\\文档\\说明.pdf</div></div><span class="badge warning">找不到项目 · 演示</span><button data-explain="重新绑定">重新绑定</button></div></div>`+bulletPanel('与完整 Dock 的边界',['本阶段：固定项目、顺序、集合、失效修复和启动反馈。','完整 Dock：边缘停靠、自动隐藏、运行应用、窗口预览与窗口控制。','不会把固定快捷方式列表描述成完整 Dock；完整 Dock 的阶段顺序单独确定。']),
search:()=>title('搜索与导航','桌面、控制中心和全局热键使用同一个搜索流程。全盘范围由 Everything 已索引的内容决定。')+`<div class="panel"><label for="query">查找项目（演示数据）</label><input id="query" type="search" placeholder="试试“报告”，查看同名结果的来源与路径"><div class="toolbar"><button data-index>${everything?'模拟断开 Everything':'模拟连接 Everything'}</button><span id="provider" class="note"></span></div><div id="results"></div><p class="note">正式版支持 ↑↓ 选择、Enter 打开、Esc 关闭；外部结果先提供访问和固定，文件操作另外验证权限。</p></div>`+bulletPanel('搜索设置',['提供方：桌面 / 收纳区 / 映射文件夹 / 已安装应用目录 / Everything。','应用目录需扫描开始菜单和 Windows 应用入口，不能只列桌面快捷方式。','本地结果先显示；旧查询结果不覆盖新查询；超时和截断显示范围。']),
widgets:()=>title('小组件','类型目录与已添加实例分开。隐藏保留内容，删除明确移除内容。')+`<div class="toolbar"><button data-explain="便签">添加便签</button><button data-explain="待办">添加待办</button><button data-explain="时钟">添加时钟</button></div><div class="panel"><h2>已添加实例</h2><div class="row"><div class="grow"><strong>项目记录 · 便签</strong><div class="note">内容保留 · 演示</div></div><span class="badge ${widgetHidden?'muted':''}">${widgetHidden?'隐藏':'显示'}</span><button data-widget>${widgetHidden?'显示并定位':'隐藏'}</button><button data-explain="删除小组件">删除</button></div><div class="row"><div class="grow"><strong>剪贴板 · 共享历史视图</strong><div class="note">文本历史仅在内存；移除视图不清空历史</div></div><button data-explain="剪贴板采集">采集设置</button></div></div>`,
layout:()=>title('布局与显示器','每个对象都有可找回的位置。显示器断开后临时回收，保留原分配。')+`<div class="screen-grid"><div class="monitor"><strong>主显示器 · 演示</strong><div class="mini">待处理 · 收纳区</div><div class="mini">项目记录 · 便签</div></div><div class="monitor"><strong>显示器 2 · 已断开示意</strong><p class="note">对象进入待恢复区，不删除内容。</p></div></div><div class="toolbar"><button data-explain="平铺">平铺面板</button><button data-explain="锁定">锁定布局</button><button data-explain="恢复布局">恢复布局</button></div>`+bulletPanel('实现与验收重点',['显示器稳定身份、负坐标、工作区与不同 DPI。','所有面板和组件可以显示并定位；隐藏对象仍可管理。','恢复布局仅调整位置和尺寸，不删除文件或便签内容。']),
appearance:()=>title('外观','功能结构确定后，使用 Nuxt UI 统一控件、字体、间距和图标。')+bulletPanel('已选择的方向',['控制中心：左侧任务导航、灰白底色、蓝色强调，页面以任务和真实状态为主。','桌面：轻量面板材质，工具栏克制；透明度不影响控制中心。','搜索：紧凑可激活窗口，明确范围与路径，键盘优先。','正式替换时做实时预览、重置和离线图标；当前草图不代表最终视觉。']),
data:()=>title('数据与备份','先预览恢复影响，保存当前配置，再应用。配置备份不包含用户原文件。')+`<div class="toolbar"><button data-explain="导出配置">导出配置</button><button class="primary" data-restore>预览导入流程</button></div><div class="hint">包含布局、设置、引用、便签和待办；不包含原文件、剪贴板历史、图标缓存或 Everything 结果。</div>`+bulletPanel('恢复预览必须说明',['将新增或改变哪些对象与内容。','哪些文件夹路径需要重新绑定，哪些显示器已变化。','旧区名不触发真实目录自动改名，配置缺少某区也不会删掉其目录。','版本校验失败保留原配置；恢复前保留可回退的配置快照。']),
system:()=>title('系统设置','常驻行为、原生桌面模式与数据操作分别说明。')+bulletPanel('统一设置',['开机启动：显式设置并显示实际执行结果。','共存模式保留原生图标；专注模式隐藏图标但不删除文件。','“隐藏 Nestra 桌面”不等于退出，也不等于暂停整理规则。','关闭控制中心隐藏到托盘；退出结束程序并恢复原生图标。','热键、诊断、运行版本和关于集中管理，设置可以从搜索定位。'])};
content.innerHTML=screens[page]();if(page==='search'){document.querySelector('#query').addEventListener('input',renderResults);renderResults()}}
function renderResults(){document.querySelector('[data-index]').textContent=everything?'模拟断开 Everything':'模拟连接 Everything';const q=document.querySelector('#query').value.trim().toLowerCase();document.querySelector('#provider').textContent=everything?'Everything：已连接（模拟）；包含演示索引结果':'Everything：未连接（模拟）；当前仅显示已知来源和应用目录';const hits=examples.filter(e=>(everything||e.source!=='Everything')&&(!q||(e.name+e.path).toLowerCase().includes(q)));document.querySelector('#results').innerHTML=hits.length?hits.map(e=>`<div class="row"><div class="grow"><strong>${esc(e.name)}</strong><div class="path">${esc(e.path)}</div></div><span class="badge muted">${e.source}</span><button data-explain="固定引用">固定</button></div>`).join(''):'<p class="empty">演示数据中没有匹配。正式产品说明搜索范围，并保留重新检测入口。</p>'}
const kinds={zone:['新建收纳区','新建真实目录；拖入会移动文件。','桌面\\.nestra\\'],mapping:['显示已有文件夹','直接查看已有目录；默认不接收拖入。','D:\\项目资料'],category:['按类型查看桌面','只按类型筛选；文件保持原位。','个人桌面 · 文档'],group:['组合多个来源','引用来源形成文件组；不创建存放文件的目录。','待处理 / 项目资料']};
function openCreate(){document.querySelector('#dialog-body').innerHTML=`<h2>添加桌面内容</h2><p class="note">先选择你想完成的任务。</p>${Object.entries(kinds).map(([id,[name,desc]])=>`<button class="choice" data-kind="${id}"><strong>${name}</strong><small>${desc}</small></button>`).join('')}<div class="dialog-footer"><button data-close>取消</button></div>`;dialog.showModal()}
function chooseKind(kind){const [name,desc,path]=kinds[kind];document.querySelector('#dialog-body').innerHTML=`<h2>${name}</h2><div class="hint">${desc}</div><label>显示名称<input id="source-name" required maxlength="60" value="${kind==='zone'?'灵感':kind==='mapping'?'项目资料':kind==='category'?'桌面文档':'工作'}"></label>${kind==='mapping'?`<label>已有目录（仅示意，草图不访问此路径）<input id="source-path" required value="${esc(path)}"></label>`:kind==='group'?'<p>选中来源：待处理 / 项目资料。正式版提供可编辑来源列表。</p>':`<p class="note">${kind==='zone'?'实际位置：'+esc(path)+'显示名称':esc(path)}</p>`}<div class="dialog-footer"><button data-close>取消</button><button class="primary" data-submit="${kind}">查看创建结果</button></div>`;document.querySelector('#source-name').focus()}
const explanations={'整理规则':'先列出将移动的文件与目标，再显式执行；自动移动默认关闭。','解散文件组':'仅拆除组织关系，来源与文件保留。','快捷集合':'把选择的引用组成集合；启动反馈逐项显示，原文件不移动。','移除引用':'移除的是快捷入口，原文件保留。','重新绑定':'用户重新选择实际目标；临时失联不自动清理入口。','删除小组件':'删除便签或待办前确认内容将移除；隐藏不会删除内容。','剪贴板采集':'采集可以暂停与关闭；内存历史不写入配置备份。','恢复布局':'只恢复位置和尺寸，不删除对象内容或文件。','导出配置':'正式版导出配置快照；草图不生成真实用户配置。','固定引用':'添加快捷引用，原文件位置不变。'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;render()}else if(b.hasAttribute('data-add'))openCreate();else if(b.dataset.kind)chooseKind(b.dataset.kind);else if(b.hasAttribute('data-close'))dialog.close();else if(b.dataset.submit){const name=document.querySelector('#source-name').value.trim();if(!name){document.querySelector('#source-name').reportValidity();return}const k=b.dataset.submit;if(k==='mapping'){const pathInput=document.querySelector('#source-path');pathInput.value=pathInput.value.trim();if(!pathInput.value){pathInput.reportValidity();return}if(sources.some(s=>s.type==='文件夹映射'&&s.path.toLowerCase()===pathInput.value.toLowerCase())){notify('这个目录已有映射，请管理现有映射。');return}}if(k!=='group')sources.push({name,type:k==='zone'?'收纳区':k==='mapping'?'文件夹映射':'分类视图',path:k==='zone'?kinds.zone[2]+name:k==='mapping'?document.querySelector('#source-path').value:kinds.category[2],visible:true,policy:kinds[k][1]});dialog.close();page='files';render();notify(k==='group'?'文件组创建流程已演示；只增加来源关系。':'已添加演示对象；没有创建目录或移动文件。')}else if(b.dataset.toggleSource!==undefined){const s=sources[+b.dataset.toggleSource];s.visible=!s.visible;render();notify(s.visible?'演示：显示并定位，内容保留。':'演示：仅隐藏面板，文件保持原位。')}else if(b.dataset.sourceDetail!==undefined){const s=sources[+b.dataset.sourceDetail];document.querySelector('#dialog-body').innerHTML=`<h2>${esc(s.name)}</h2><p>${s.type} · ${s.policy}</p><p class="path">${esc(s.path)}</p><div class="hint">${s.type==='收纳区'?'解散前逐项放回桌面；遇到失败保留目录和失败项。':'移除视图只改配置，不删除或移动原文件。'}</div><div class="dialog-footer"><button data-close>返回列表</button></div>`;dialog.showModal()}else if(b.dataset.flow){flow=b.dataset.flow;render()}else if(b.hasAttribute('data-index')){everything=!everything;renderResults()}else if(b.hasAttribute('data-widget')){widgetHidden=!widgetHidden;render();notify('演示：显隐改变，组件内容保留。')}else if(b.hasAttribute('data-restore')){page='desktop';flow='restore';render()}else if(b.dataset.explain)notify(explanations[b.dataset.explain]||'设计范围：'+b.dataset.explain+'。当前为流程草图，未执行系统操作。')});
render();
</script></body></html>
