 h('details',{style:'position:fixed;bottom:18px;left:24px;color:#a9b6cb;font-size:11px;max-width:80%;z-index:9000'},[h('summary','组件验收 · 示例数据'),h('output',{'aria-label':'验收数据'},state.value),h('p',{'aria-label':'搜索调用次数'},`搜索调用：${searchOpens}`),h('p',{'aria-label':'打开调用次数'},`打开调用：${launches.length}`),h('p',{'aria-label':'裁剪同步次数'},`裁剪同步：${regionCalls}`)]),
